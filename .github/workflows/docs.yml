name: Docs

on:
  push:
    branches: [master]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r docs/requirements.txt

      - name: Build documentation
        run: sphinx-build -b html docs docs/_build/html -W

      - name: Deploy to https://arnablahiry.github.io/software/toy-galaxy-morphological-textures/
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_DOCS }}
          publish_dir: docs/_build/html
          external_repository: arnablahiry/arnablahiry.github.io
          publish_branch: main
          destination_dir: software/toy-galaxy-morphological-textures
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy docs for toy-galaxy-morphology-textures@${{ github.sha }}"
