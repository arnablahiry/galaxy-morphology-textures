[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxy-textures"
version = "0.1.0"
description = "Procedural synthetic galaxy textures for ML interpretability work and teaching."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=1.12",
    "numpy>=1.22",
    "matplotlib>=3.5",
]

[tool.setuptools.packages.find]
include = ["galaxy_textures*"]
